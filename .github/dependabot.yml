version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      production-npm:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-npm:
        dependency-type: development
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - javascript
      - security
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
