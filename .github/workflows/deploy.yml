name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  CLOUDFLARE_ACCOUNT_ID: aedee6c75c522d80181feb43639ef0a6

jobs:
  preview:
    name: Preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check Cloudflare token
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is not set. Add it under Settings → Secrets and variables → Actions to enable PR preview deploys."
            echo "## Preview skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Add repository secret \`CLOUDFLARE_API_TOKEN\` (Workers Scripts Edit + D1 Edit)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload preview version
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm
          wranglerVersion: "4.126.0"
          command: versions upload

  production:
    name: Production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://vite-react-template.unruly-bounce.workers.dev
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check Cloudflare token
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is not set. Add it under Settings → Secrets and variables → Actions, then re-run this workflow."
            {
              echo "## Production deploy skipped"
              echo ""
              echo "This workflow is live, but GitHub has no Cloudflare token yet."
              echo ""
              echo "1. Claim the preview account if you have not already (see README)."
              echo "2. Create a token with **Edit Cloudflare Workers** + **D1 Edit**: https://dash.cloudflare.com/profile/api-tokens"
              echo "3. Add it as repository secret \`CLOUDFLARE_API_TOKEN\`."
              echo "4. Re-run **Actions → Deploy to Cloudflare** (or push to \`main\`)."
              echo ""
              echo "Account ID is already in \`wrangler.json\` (\`aedee6c75c522d80181feb43639ef0a6\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "4.126.0"
          command: d1 migrations apply vite-react-db --remote

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm
          wranglerVersion: "4.126.0"
          command: deploy
