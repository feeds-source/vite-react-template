name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  pages:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check Cloudflare token
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - name: Pages SPA + API proxy rules
        run: |
          cat >> dist/client/_redirects << 'EOF'
          /api/*  https://vite-react-template.limefashion52.workers.dev/api/:splat  200
          /*      /index.html  200
          EOF
      - name: Ensure Pages project
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ACCOUNT="${CLOUDFLARE_ACCOUNT_ID:-1e611220afd75688b509ba299e98bde7}"
          export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT"
          npx wrangler@4.126.0 pages project create silkmoments --production-branch=main || true
      - name: Deploy Pages
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "1e611220afd75688b509ba299e98bde7"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm
          wranglerVersion: "4.126.0"
          command: pages deploy dist/client --project-name=silkmoments --branch=${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Pages status
        run: |
          if [ "${{ steps.creds.outputs.ready }}" != "true" ]; then
            echo "CLOUDFLARE_API_TOKEN missing — Pages upload skipped."
            echo "Live shop is the Worker. Connect this repo in Cloudflare with the GitHub App to publish Pages."
            exit 0
          fi
          if [ "${{ steps.deploy.outcome }}" = "failure" ]; then
            echo "::warning::Pages API token has Workers/D1, not Pages:Edit. The GitHub App (cloudflare-workers-and-pages) cannot be used from Actions — connect feeds-source/vite-react-template in the Cloudflare dashboard (Workers & Pages → Create → Pages → Connect GitHub). Live shop remains the Worker on www.silkmoments.com."
            exit 0
          fi
          echo "Pages deployed."
