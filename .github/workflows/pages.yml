name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  pages:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check Cloudflare token
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - name: Pages SPA + API proxy rules
        run: |
          cat >> dist/client/_redirects << 'EOF'
          /api/*  https://vite-react-template.limefashion52.workers.dev/api/:splat  200
          /*      /index.html  200
          EOF
      - name: Ensure Pages project
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ACCOUNT="${CLOUDFLARE_ACCOUNT_ID:-1e611220afd75688b509ba299e98bde7}"
          export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT"
          npx wrangler@4.126.0 pages project create silkmoments --production-branch=main || true
      - name: Deploy Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "1e611220afd75688b509ba299e98bde7"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm
          wranglerVersion: "4.126.0"
          command: pages deploy dist/client --project-name=silkmoments --branch=${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Skip notice
        if: steps.creds.outputs.ready != 'true'
        run: echo "CLOUDFLARE_API_TOKEN missing — Pages deploy skipped."
